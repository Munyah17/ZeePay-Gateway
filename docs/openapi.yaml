openapi: 3.0.3
info:
  title: ZeePay API
  description: |
    ZeePay Payment Gateway API

    ZeePay provides a unified API for accepting payments through multiple payment methods in Zimbabwe and across Africa.

    ## Authentication

    All API requests require authentication using an API key in the `X-API-Key` header.

    ## Idempotency

    To prevent duplicate charges, you can include an `idempotencyKey` in the request body for idempotent operations.

    ## Webhooks

    Configure webhooks to receive real-time notifications about payment events. All webhook signatures are generated using HMAC-SHA256.

  version: 1.0.0
  contact:
    name: ZeePay Support
    email: support@zeepay.co.zw
    url: https://zeepay.co.zw
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.zeepay.co.zw/v1
    description: Production server
  - url: https://api-test.zeepay.co.zw/v1
    description: Test server

security:
  - ApiKeyAuth: []

tags:
  - name: Payments
    description: Payment operations
  - name: Refunds
    description: Refund operations
  - name: Payment Methods
    description: Available payment methods
  - name: Webhooks
    description: Webhook configuration and management
  - name: Subscriptions
    description: Recurring billing with auto-deduct
  - name: Payouts
    description: Disbursements to customer wallets

paths:
  /payments:
    post:
      tags:
        - Payments
      summary: Create a payment
      description: Create a new payment and get a checkout URL
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Payment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - Payments
      summary: List payments
      description: List all payments for the authenticated merchant
      operationId: listPayments
      parameters:
        - name: limit
          in: query
          description: Number of payments to return
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: offset
          in: query
          description: Number of payments to skip
          schema:
            type: integer
            default: 0
        - name: status
          in: query
          description: Filter by payment status
          schema:
            type: string
            enum: [pending, processing, succeeded, failed, cancelled]
      responses:
        '200':
          description: List of payments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments/{id}:
    get:
      tags:
        - Payments
      summary: Get a payment
      description: Retrieve details of a specific payment
      operationId: getPayment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Payments
      summary: Cancel a payment
      description: Cancel a pending payment
      operationId: cancelPayment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [cancel]
      responses:
        '200':
          description: Payment cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Cannot cancel payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /refunds:
    post:
      tags:
        - Refunds
      summary: Create a refund
      description: Create a refund for a successful payment
      operationId: createRefund
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRefundRequest'
      responses:
        '201':
          description: Refund created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /refunds/{id}:
    get:
      tags:
        - Refunds
      summary: Get a refund
      description: Retrieve details of a specific refund
      operationId: getRefund
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Refund details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '404':
          description: Refund not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payment-methods:
    get:
      tags:
        - Payment Methods
      summary: List payment methods
      description: Get all available payment methods
      operationId: listPaymentMethods
      responses:
        '200':
          description: List of payment methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodListResponse'

  /webhooks:
    post:
      tags:
        - Webhooks
      summary: Create webhook endpoint
      description: Create a new webhook endpoint to receive payment events
      operationId: createWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
      responses:
        '201':
          description: Webhook created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookWithSecret'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - Webhooks
      summary: List webhooks
      description: List all webhook endpoints for the merchant
      operationId: listWebhooks
      responses:
        '200':
          description: List of webhooks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookListResponse'

  /webhooks/{id}:
    get:
      tags:
        - Webhooks
      summary: Get webhook
      description: Retrieve details of a specific webhook endpoint
      operationId: getWebhook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Webhook details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
        - Webhooks
      summary: Update webhook
      description: Update a webhook endpoint
      operationId: updateWebhook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookRequest'
      responses:
        '200':
          description: Webhook updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookWithSecret'
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Webhooks
      summary: Delete webhook
      description: Delete a webhook endpoint
      operationId: deleteWebhook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Webhook deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /subscriptions:
    post:
      tags: [Subscriptions]
      summary: Create a subscription
      description: |
        Creates a subscription with automatic recurring debits. A payment mandate
        is created with the provider — for mobile money (EcoCash, InnBucks, Omari)
        the customer approves the mandate once (PIN/USSD prompt), and for cards
        the mandate is tokenized during an initial authorization. Once active,
        ZeePay debits the customer automatically on each billing date —
        including methods that do not natively support recurring payments.
      operationId: createSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionRequest'
      responses:
        '201':
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [Subscriptions]
      summary: List subscriptions
      operationId: listSubscriptions
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, active, past_due, paused, cancelled]
      responses:
        '200':
          description: List of subscriptions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionListResponse'

  /subscriptions/{id}:
    get:
      tags: [Subscriptions]
      summary: Get a subscription
      operationId: getSubscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Subscription details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [Subscriptions]
      summary: Update a subscription
      description: Pause, resume, or cancel a subscription.
      operationId: updateSubscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [pause, resume, cancel]
                reason:
                  type: string
      responses:
        '200':
          description: Updated subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
    delete:
      tags: [Subscriptions]
      summary: Cancel a subscription
      description: Cancels the subscription and revokes the underlying payment mandate.
      operationId: cancelSubscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: reason
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Cancelled subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'

  /subscriptions/{id}/approve:
    post:
      tags: [Subscriptions]
      summary: Approve a subscription mandate
      description: |
        Marks a pending subscription's mandate as approved. In production this is
        invoked by the provider callback after the customer completes authorization
        (PIN prompt, wallet approval, or card 3DS). In sandbox it simulates that step.
      operationId: approveSubscription
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Activated subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'

  /subscriptions/process-due:
    post:
      tags: [Subscriptions]
      summary: Run the billing engine
      description: |
        Charges all subscriptions whose next billing date has passed. Invoke on a
        schedule (e.g. hourly cron). Secured by the `CRON_SECRET` bearer token.
      operationId: processDueSubscriptions
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Billing run summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  processed:
                    type: integer
                  succeeded:
                    type: integer
                  failed:
                    type: integer
                  cancelled:
                    type: integer
                  errors:
                    type: array
                    items:
                      type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payouts:
    post:
      tags: [Payouts]
      summary: Create a payout
      description: |
        Disburse funds into a customer's wallet via the provider's disbursement
        service (EcoCash Enterprise Cash-In, Disburse Change, or Merchant to
        Subscriber). The call is synchronous — the result returns on the same
        request. `externalReference` is the idempotency key: resending the same
        reference returns the original transaction.
      operationId: createPayout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePayoutRequest'
      responses:
        '201':
          description: Payout created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [Payouts]
      summary: List payouts
      operationId: listPayouts
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, succeeded, failed]
        - name: serviceType
          in: query
          schema:
            type: string
            enum: [enterprise_cash_in, change_disbursement, merchant_to_subscriber]
      responses:
        '200':
          description: List of payouts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutListResponse'

  /payouts/{reference}:
    get:
      tags: [Payouts]
      summary: Look up a payout
      description: |
        Retrieve a payout by its `externalReference`. Syncs the latest state
        from the provider's transaction lookup when the payout has not reached
        a terminal status.
      operationId: getPayout
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
          description: The externalReference used when creating the payout
      responses:
        '200':
          description: Payout details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /webhooks/{id}/deliveries:
    get:
      tags:
        - Webhooks
      summary: Get webhook deliveries
      description: Get delivery history for a webhook endpoint
      operationId: getWebhookDeliveries
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Number of deliveries to return
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: List of webhook deliveries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryListResponse'

  /customers:
    post:
      tags:
        - Customers
      summary: Create customer
      description: Create a customer record, or return the existing one for the same externalReference (idempotent).
      operationId: createCustomer
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Customer created or returned
    get:
      tags:
        - Customers
      summary: List customers
      operationId: listCustomers
      security:
        - ApiKeyAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: email
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of customers

  /saved-payment-methods:
    post:
      tags:
        - Saved Payment Methods
      summary: Tokenise a payment method
      description: |
        Register a customer's card/wallet for reuse. For cards the response contains
        `approvalUrl` — the customer enters card details once on the ZimSwitch-hosted
        tokenisation widget (SAQ-A scope; raw PAN/CVV never touch ZeePay). Activate with
        `POST /saved-payment-methods/{id}/activate` after the customer completes the flow.
        Pass `paymentId` instead to claim the token created during an earlier card payment.
      operationId: registerPaymentMethod
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPaymentMethodRequest'
      responses:
        '201':
          description: Saved payment method created (pending or active)
    get:
      tags:
        - Saved Payment Methods
      summary: List saved payment methods
      operationId: listSavedPaymentMethods
      security:
        - ApiKeyAuth: []
      parameters:
        - name: customerId
          in: query
          schema:
            type: string
            format: uuid
        - name: customerEmail
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, active, revoked, failed]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of saved payment methods

  /saved-payment-methods/{id}:
    get:
      tags:
        - Saved Payment Methods
      summary: Get a saved payment method
      operationId: getSavedPaymentMethod
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Saved payment method
        '404':
          description: Not found
    patch:
      tags:
        - Saved Payment Methods
      summary: Update a saved payment method
      description: Rename the label or set the method as the customer's default.
      operationId: updateSavedPaymentMethod
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                setAsDefault:
                  type: boolean
      responses:
        '200':
          description: Updated saved payment method
    delete:
      tags:
        - Saved Payment Methods
      summary: Remove a saved payment method
      description: Revokes the provider token — no further merchant-initiated charges are possible.
      operationId: removeSavedPaymentMethod
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment method revoked
        '409':
          description: In use by active subscriptions

  /saved-payment-methods/{id}/activate:
    post:
      tags:
        - Saved Payment Methods
      summary: Activate a pending token
      description: |
        Finalise tokenisation after the customer completes the hosted flow
        (ZimSwitch registration widget / 3DS / wallet approval). Resolves the
        durable provider token (registrationId) from the checkout reference.
      operationId: activateSavedPaymentMethod
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Activated saved payment method

  /plans:
    post:
      tags:
        - Plans
      summary: Create a subscription plan
      description: Create a reusable billing template (amount, currency, interval) customers subscribe to.
      operationId: createPlan
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
      responses:
        '201':
          description: Plan created
    get:
      tags:
        - Plans
      summary: List subscription plans
      operationId: listPlans
      security:
        - ApiKeyAuth: []
      parameters:
        - name: activeOnly
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of plans

  /plans/{id}:
    get:
      tags:
        - Plans
      summary: Get a plan
      operationId: getPlan
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Plan details
        '404':
          description: Not found
    patch:
      tags:
        - Plans
      summary: Update a plan
      description: Changes affect only future subscriptions; move existing subscriptions via PATCH /subscriptions/{id} action=change_plan.
      operationId: updatePlan
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlanRequest'
      responses:
        '200':
          description: Updated plan
    delete:
      tags:
        - Plans
      summary: Deactivate a plan
      operationId: deactivatePlan
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Plan deactivated

  /checkout/{id}:
    get:
      tags:
        - Checkout
      summary: Checkout context
      description: Public endpoint — payment details plus the customer's active saved payment methods for one-click checkout.
      operationId: getCheckoutContext
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment + saved payment methods
        '404':
          description: Payment not found

  /checkout/{id}/pay:
    post:
      tags:
        - Checkout
      summary: One-click payment
      description: |
        Public endpoint — charge a saved payment method for this checkout's amount.
        The method must belong to the same merchant and customer as the payment.
        Returns `requiresAction` + `checkoutUrl` when step-up auth (3DS) is needed.
      operationId: oneClickPay
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [savedPaymentMethodId]
              properties:
                savedPaymentMethodId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Payment result
        '402':
          description: Payment failed
        '403':
          description: Method does not belong to this customer

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    CreatePaymentRequest:
      type: object
      required:
        - amount
        - currency
        - reference
      properties:
        amount:
          type: number
          format: decimal
          description: Payment amount
          example: 10.00
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 currency code
          example: USD
        reference:
          type: string
          maxLength: 255
          description: Merchant's unique reference for this payment
          example: invoice_1042
        returnUrl:
